<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediLink 医院内网远程协助平台</title>
<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --primary: #1a6fd4;
    --primary-dark: #145bb0;
    --success: #1f9d55;
    --danger: #d64545;
    --warn: #d98a00;
    --text: #1f2d3d;
    --muted: #6b7c93;
    --border: #e2e8f0;
    --radius: 10px;
    --shadow: 0 2px 10px rgba(24, 50, 90, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  a { color: var(--primary); }
  .hidden { display: none !important; }

  /* 登录页 */
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0d3b66 0%, #1a6fd4 60%, #2a9d8f 100%); }
  .login-card { width: 380px; background: #fff; border-radius: 16px; padding: 36px 34px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .login-card h1 { margin: 0 0 6px; font-size: 24px; }
  .login-card .sub { color: var(--muted); margin-bottom: 26px; font-size: 13px; }
  .logo-badge { width: 46px; height: 46px; border-radius: 12px; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; margin-bottom: 16px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: #fff;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,111,212,.12); }
  .btn { padding: 9px 16px; border: 1px solid transparent; border-radius: 8px; background: var(--primary); color: #fff; font-size: 14px; }
  .btn:hover { background: var(--primary-dark); }
  .btn.block { width: 100%; padding: 11px; }
  .btn.ghost { background: #fff; color: var(--text); border-color: var(--border); }
  .btn.ghost:hover { background: #f1f5f9; }
  .btn.danger { background: var(--danger); }
  .btn.danger:hover { background: #b93a3a; }
  .btn.small { padding: 5px 10px; font-size: 12.5px; border-radius: 6px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 6px; }

  /* 主布局 */
  #app { display: none; min-height: 100vh; }
  #app.ready { display: flex; }
  aside { width: 220px; background: #0d2b4e; color: #cfe0f5; display: flex; flex-direction: column; }
  aside .brand { padding: 20px 18px; font-weight: 700; font-size: 17px; color: #fff; display: flex; align-items: center; gap: 10px; }
  aside .brand span.badge { background: var(--primary); border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  aside nav { flex: 1; padding: 8px; }
  aside nav a { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 8px; color: #cfe0f5; text-decoration: none; margin-bottom: 4px; font-size: 14px; }
  aside nav a:hover { background: rgba(255,255,255,.08); }
  aside nav a.active { background: var(--primary); color: #fff; }
  aside .foot { padding: 14px 18px; font-size: 12px; color: #7f9dc0; border-top: 1px solid rgba(255,255,255,.1); }

  main { flex: 1; padding: 22px 26px; overflow: auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar h2 { margin: 0; font-size: 20px; }
  .topbar .who { color: var(--muted); font-size: 13px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .card .num { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .card .lbl { color: var(--muted); font-size: 13px; }

  .panel { background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
  .panel .head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .panel .head h3 { margin: 0; font-size: 16px; margin-right: auto; }
  .panel .body { padding: 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; outline: none; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; background: #fafcff; position: sticky; top: 0; }
  tbody tr:hover { background: #f7faff; }
  td.mono { font-family: Consolas, "Courier New", monospace; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; }
  .pill.online { background: #e5f6ec; color: var(--success); }
  .pill.offline { background: #f0f2f5; color: var(--muted); }
  .pill.gray { background: #eef1f5; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }

  .empty { padding: 40px; text-align: center; color: var(--muted); }

  /* 弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(15,30,55,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 14px; width: 560px; max-width: 94vw; max-height: 90vh; overflow: auto; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .modal .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal .modal-head h3 { margin: 0; font-size: 17px; }
  .modal .modal-body { padding: 20px 22px; }
  .modal .modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .close-x { background: none; border: none; font-size: 20px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; align-items: center; }
  .kv .k { color: var(--muted); }
  .copyrow { display: flex; align-items: center; gap: 8px; }
  .copyrow code { flex: 1; background: #f4f7fb; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-family: Consolas, monospace; word-break: break-all; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #12263f; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13.5px; opacity: 0; transition: opacity .25s; z-index: 100; }
  .toast.show { opacity: .96; }
  .section-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 22px 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .switch { display: flex; align-items: center; gap: 8px; }
  .switch input { width: auto; }
  .help { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .badge-count { background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo-badge">ML</div>
    <h1>MediLink 管理平台</h1>
    <div class="sub">医院内网远程协助 · 设备台账与会话审计</div>
    <div class="err" id="loginErr"></div>
    <form id="loginForm">
      <div class="field"><label>管理员账号</label><input id="u" autocomplete="username" required /></div>
      <div class="field"><label>口令</label><input id="p" type="password" autocomplete="current-password" required /></div>
      <button class="btn block" type="submit">登 录</button>
    </form>
  </div>
</div>

<div id="app">
  <aside>
    <div class="brand"><span class="badge">ML</span><span id="brandName">MediLink</span></div>
    <nav>
      <a href="#overview" data-view="overview" class="active">概览</a>
      <a href="#devices" data-view="devices">设备台账</a>
      <a href="#audit" data-view="audit">会话审计</a>
      <a href="#settings" data-view="settings">系统设置</a>
    </nav>
    <div class="foot">MediLink v<span id="ver">1.0.0</span><br/>数据不出内网</div>
  </aside>
  <main>
    <div class="topbar">
      <h2 id="pageTitle">概览</h2>
      <div><span class="who" id="who"></span>　<button class="btn ghost small" id="logoutBtn">退出</button></div>
    </div>

    <!-- 概览 -->
    <section id="view-overview">
      <div class="cards" id="statCards"></div>
      <div class="panel">
        <div class="head"><h3>最近会话</h3><button class="btn ghost small" onclick="App.exportAudit()">导出全部审计</button></div>
        <div class="body"><div id="recentAudit"></div></div>
      </div>
    </section>

    <!-- 设备台账 -->
    <section id="view-devices" class="hidden">
      <div class="panel">
        <div class="head">
          <h3>设备台账</h3>
          <div class="toolbar">
            <input id="devQ" placeholder="搜索 设备ID/计算机名/使用人/IP/科室" style="width:260px" />
            <select id="devDept"><option value="">全部科室</option></select>
            <select id="devStatus"><option value="">全部状态</option><option value="online">在线</option><option value="offline">离线</option></select>
            <button class="btn ghost small" onclick="App.loadDevices()">查询</button>
            <button class="btn ghost small" onclick="App.exportDevices()">导出 CSV</button>
            <button class="btn small" onclick="App.openDeviceModal()">新增设备</button>
          </div>
        </div>
        <div class="body"><div id="devTable"></div></div>
      </div>
    </section>

    <!-- 审计 -->
    <section id="view-audit" class="hidden">
      <div class="panel">
        <div class="head">
          <h3>会话审计</h3>
          <div class="toolbar">
            <input id="auditQ" placeholder="搜索 操作人/设备/动作/备注" style="width:260px" />
            <select id="auditLimit"><option value="200">最近 200 条</option><option value="500">最近 500 条</option><option value="1000">最近 1000 条</option></select>
            <button class="btn ghost small" onclick="App.loadAudit()">查询</button>
            <button class="btn ghost small" onclick="App.exportAudit()">导出 CSV</button>
          </div>
        </div>
        <div class="body"><div id="auditTable"></div></div>
      </div>
    </section>

    <!-- 设置 -->
    <section id="view-settings" class="hidden">
      <div class="panel">
        <div class="head"><h3>RustDesk 与接入设置</h3></div>
        <div class="body" style="padding:20px 22px;">
          <div class="grid2">
            <div class="field"><label>站点名称</label><input id="s_site_name" /></div>
            <div class="field"><label>ID 服务器 (hbbs)</label><input id="s_rendezvous_server" placeholder="10.0.0.10:21116" /></div>
            <div class="field"><label>中继服务器 (hbbr)</label><input id="s_relay_server" placeholder="10.0.0.10:21117" /></div>
            <div class="field"><label>RustDesk Key（服务端公钥）</label><input id="s_rustdesk_key" /></div>
            <div class="field"><label>被控端注册密钥 (Enrollment Key)</label><input id="s_enrollment_key" placeholder="留空表示不校验（仅建议内网测试）" /></div>
            <div class="field"><label>审计日志留存天数</label><input id="s_audit_retention_days" type="number" min="30" /></div>
          </div>
          <div class="section-title">安全策略</div>
          <div class="grid2">
            <label class="switch"><input type="checkbox" id="s_allow_registration" /><span>允许被控端自动注册</span></label>
            <label class="switch"><input type="checkbox" id="s_require_approval" /><span>连接需被控端确认（生产建议开启）</span></label>
            <label class="switch"><input type="checkbox" id="s_default_readonly" /><span>默认只读，操作权限按需申请</span></label>
          </div>
          <div style="margin-top:22px;"><button class="btn" onclick="App.saveSettings()">保存设置</button></div>
          <div class="help">修改 ID/中继服务器与 Key 后，被控端将在下次心跳时获取；建议同时在 RustDesk 客户端侧校验。</div>
        </div>
      </div>
      <div class="panel">
        <div class="head"><h3>修改管理员口令</h3></div>
        <div class="body" style="padding:20px 22px;">
          <div class="grid2">
            <div class="field"><label>原口令</label><input id="cp_old" type="password" /></div>
            <div class="field"><label>新口令（≥8 位）</label><input id="cp_new" type="password" /></div>
          </div>
          <button class="btn" onclick="App.changePassword()">修改口令</button>
        </div>
      </div>
      <div class="panel">
        <div class="head"><h3>审计日志维护</h3></div>
        <div class="body" style="padding:20px 22px;">
          <button class="btn ghost" onclick="App.cleanupAudit()">清理超期审计日志</button>
          <div class="help">按“留存天数”删除更早记录，满足等保留存要求的同时控制数据量。</div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
const API = location.origin;
const state = { token: localStorage.getItem('ml_token') || '', user: null, devices: [], settings: {} };

function h(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(state.token) headers['Authorization'] = 'Bearer '+state.token;
  const r = await fetch(API+path, Object.assign({}, opts, {headers}));
  if(r.status===401 && state.token){ logout(); throw new Error('登录已过期'); }
  const ct = r.headers.get('content-type')||'';
  if(ct.includes('application/json')) return r.json();
  return r.text();
}

const App = {
  async boot(){
    if(state.token){
      try { const me = await api('/api/auth/me'); state.user = me.user; showApp(); return; } catch(e){}
    }
    document.getElementById('login').classList.remove('hidden');
  },
  async login(ev){
    ev.preventDefault();
    const err=document.getElementById('loginErr'); err.textContent='';
    try{
      const r = await api('/api/auth/login',{method:'POST',body:JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value
      })});
      if(!r.ok){ err.textContent = r.error||'登录失败'; return; }
      state.token = r.token; state.user = r.user; localStorage.setItem('ml_token', r.token);
      document.getElementById('p').value='';
      showApp();
    }catch(e){ err.textContent = '无法连接服务端：'+e.message; }
  },
  async loadOverview(){
    const r = await api('/api/stats');
    const s = r.stats;
    const cards = [
      ['设备总数', s.devices_total, '#1a6fd4'],
      ['在线设备', s.devices_online, '#1f9d55'],
      ['离线设备', s.devices_offline, '#6b7c93'],
      ['覆盖科室', s.departments, '#2a9d8f'],
      ['今日会话', s.sessions_today, '#d98a00'],
      ['审计记录', s.audit_total, '#8e5bd4'],
    ];
    document.getElementById('statCards').innerHTML = cards.map(c=>
      `<div class="card"><div class="lbl">${c[0]}</div><div class="num" style="color:${c[2]}">${c[1]}</div></div>`).join('');
    const a = await api('/api/audit?limit=15');
    document.getElementById('recentAudit').innerHTML = auditTableHtml(a.items);
  },
  async loadDevices(){
    const q = document.getElementById('devQ').value.trim();
    const dept = document.getElementById('devDept').value;
    const st = document.getElementById('devStatus').value;
    const r = await api('/api/devices?q='+encodeURIComponent(q)+'&department='+encodeURIComponent(dept)+'&status='+st);
    state.devices = r.items;
    renderDeviceTable(r.items);
    const depts = [...new Set(r.items.map(d=>d.department).filter(Boolean))].sort();
    const sel = document.getElementById('devDept'); const cur = sel.value;
    sel.innerHTML = '<option value="">全部科室</option>'+depts.map(d=>`<option ${d===cur?'selected':''}>${esc(d)}</option>`).join('');
  },
  exportDevices(){ window.open(API+'/api/devices/export.csv','_blank'); },
  exportAudit(){ window.open(API+'/api/audit/export.csv','_blank'); },
  async loadAudit(){
    const q = document.getElementById('auditQ').value.trim();
    const limit = document.getElementById('auditLimit').value;
    const r = await api('/api/audit?q='+encodeURIComponent(q)+'&limit='+limit);
    document.getElementById('auditTable').innerHTML = auditTableHtml(r.items);
  },
  async loadSettings(){
    const r = await api('/api/settings');
    state.settings = r.settings;
    const s=r.settings;
    document.getElementById('s_site_name').value = s.site_name||'';
    document.getElementById('s_rendezvous_server').value = s.rendezvous_server||'';
    document.getElementById('s_relay_server').value = s.relay_server||'';
    document.getElementById('s_rustdesk_key').value = s.rustdesk_key||'';
    document.getElementById('s_enrollment_key').value = s.enrollment_key||'';
    document.getElementById('s_audit_retention_days').value = s.audit_retention_days||180;
    document.getElementById('s_allow_registration').checked = s.allow_registration==='1';
    document.getElementById('s_require_approval').checked = s.require_approval==='1';
    document.getElementById('s_default_readonly').checked = s.default_readonly==='1';
    if(s.site_name){ document.getElementById('brandName').textContent='MediLink'; }
  },
  async saveSettings(){
    const body = {
      site_name: document.getElementById('s_site_name').value,
      rendezvous_server: document.getElementById('s_rendezvous_server').value,
      relay_server: document.getElementById('s_relay_server').value,
      rustdesk_key: document.getElementById('s_rustdesk_key').value,
      enrollment_key: document.getElementById('s_enrollment_key').value,
      audit_retention_days: document.getElementById('s_audit_retention_days').value,
      allow_registration: document.getElementById('s_allow_registration').checked,
      require_approval: document.getElementById('s_require_approval').checked,
      default_readonly: document.getElementById('s_default_readonly').checked,
    };
    await api('/api/settings',{method:'PUT',body:JSON.stringify(body)});
    toast('设置已保存');
  },
  async changePassword(){
    const oldp=document.getElementById('cp_old').value, newp=document.getElementById('cp_new').value;
    const r = await api('/api/auth/password',{method:'POST',body:JSON.stringify({old_password:oldp,new_password:newp})});
    if(!r.ok){ toast(r.error||'修改失败'); return; }
    toast('口令已修改，请重新登录'); setTimeout(logout, 1200);
  },
  async cleanupAudit(){
    if(!confirm('确认按留存天数清理超期审计日志？')) return;
    const r = await api('/api/audit/cleanup',{method:'POST'});
    toast('已清理 '+r.removed+' 条');
  },
  openDeviceModal(device){
    const d = device||{};
    const body = `
      <div class="field"><label>RustDesk 设备 ID *</label><input id="m_rustdesk_id" value="${esc(d.rustdesk_id)}" ${device?'disabled':''}/></div>
      <div class="grid2">
        <div class="field"><label>计算机名</label><input id="m_hostname" value="${esc(d.hostname)}"/></div>
        <div class="field"><label>使用人</label><input id="m_username" value="${esc(d.username)}"/></div>
        <div class="field"><label>科室</label><input id="m_department" value="${esc(d.department)}"/></div>
        <div class="field"><label>IP 地址</label><input id="m_ip" value="${esc(d.ip)}"/></div>
      </div>
      <div class="field"><label>标签（逗号分隔）</label><input id="m_tags" value="${esc(d.tags)}"/></div>
      <div class="field"><label>备注</label><textarea id="m_notes" rows="2">${esc(d.notes)}</textarea></div>`;
    openModal(device?'编辑设备':'新增设备', body, async ()=>{
      const payload = {
        rustdesk_id: document.getElementById('m_rustdesk_id').value.trim(),
        hostname: document.getElementById('m_hostname').value.trim(),
        username: document.getElementById('m_username').value.trim(),
        department: document.getElementById('m_department').value.trim(),
        ip: document.getElementById('m_ip').value.trim(),
        tags: document.getElementById('m_tags').value.trim(),
        notes: document.getElementById('m_notes').value.trim(),
      };
      const r = device
        ? await api('/api/devices/'+device.id,{method:'PUT',body:JSON.stringify(payload)})
        : await api('/api/devices',{method:'POST',body:JSON.stringify(payload)});
      if(!r.ok){ toast(r.error||'保存失败'); return false; }
      toast('已保存'); App.loadDevices(); return true;
    });
  },
  async connect(id){
    let r;
    try { r = await api('/api/audit/connect',{method:'POST',body:JSON.stringify({device_id:id})}); }
    catch(e){ toast('发起失败'); return; }
    if(!r.ok){ toast(r.error||'发起失败'); return; }
    const d = r.device;
    state.activeSession = r.session_id;
    const body = `
      <div class="kv">
        <div class="k">目标设备</div><div>${esc(d.hostname)}（${esc(d.department||'未分类')}）</div>
        <div class="k">设备 ID</div><div class="copyrow"><code>${esc(d.rustdesk_id)}</code><button class="btn ghost small" onclick="copyText('${esc(d.rustdesk_id)}')">复制</button></div>
        <div class="k">无人值守密码</div><div class="copyrow"><code>${esc(r.unattended_password||'（未设置）')}</code>${r.unattended_password?`<button class="btn ghost small" onclick="copyText('${esc(r.unattended_password)}')">复制</button>`:''}</div>
        <div class="k">连接命令</div><div class="copyrow"><code>${esc(r.connect_command)}</code><button class="btn ghost small" onclick="copyText('${esc(r.connect_command)}')">复制</button></div>
      </div>
      <div class="help" style="margin-top:14px">已记录审计（会话 ${esc(r.session_id.slice(0,8))}）。请在本机 RustDesk 中粘贴设备 ID 发起连接；连接结束后点击“结束会话”以记录时长。</div>`;
    openModal('发起远程协助', body, async ()=>{ await App.endSession(); toast('会话已结束'); App.loadAudit(); App.loadOverview(); return true; }, '结束会话');
  },
  async endSession(){
    if(state.activeSession){
      await api('/api/audit/session/'+state.activeSession+'/end',{method:'POST',body:JSON.stringify({result:'ended'})});
      state.activeSession = null;
    }
  },
  async del(id){
    if(!confirm('确认从台账删除该设备？（不影响被控端，仅移除记录）')) return;
    await api('/api/devices/'+id,{method:'DELETE'});
    toast('已删除'); App.loadDevices();
  },
  async rotate(id){
    if(!confirm('确认轮换该设备的无人值守密码？需被控端下次心跳后生效，请同步更新。')) return;
    const r = await api('/api/devices/'+id+'/rotate-password',{method:'POST'});
    if(r.ok){ alert('新密码：'+r.password); App.loadDevices(); }
  },
  async openEdit(id){
    const r = await api('/api/devices/'+id);
    App.openDeviceModal(r.device);
  }
};

function renderDeviceTable(items){
  if(!items.length){ document.getElementById('devTable').innerHTML='<div class="empty">暂无设备。请部署被控端，或手动新增。</div>'; return; }
  const rows = items.map(d=>`
    <tr>
      <td class="mono">${esc(d.rustdesk_id)}</td>
      <td>${esc(d.hostname)||'-'}</td>
      <td>${esc(d.username)||'-'}</td>
      <td>${d.department?`<span class="pill gray">${esc(d.department)}</span>`:'-'}</td>
      <td class="mono">${esc(d.ip)||'-'}</td>
      <td>${d.online?'<span class="pill online"><span class="dot"></span>在线</span>':'<span class="pill offline"><span class="dot"></span>离线</span>'}</td>
      <td>${d.last_seen?esc(new Date(d.last_seen).toLocaleString('zh-CN')):'-'}</td>
      <td style="white-space:nowrap">
        <button class="btn small" onclick="App.connect(${d.id})">远程协助</button>
        <button class="btn ghost small" onclick="App.rotate(${d.id})">换密码</button>
        <button class="btn ghost small" onclick="App.openEdit(${d.id})">编辑</button>
        <button class="btn ghost small" onclick="App.del(${d.id})">删除</button>
      </td>
    </tr>`).join('');
  document.getElementById('devTable').innerHTML = `<table>
    <thead><tr><th>设备 ID</th><th>计算机名</th><th>使用人</th><th>科室</th><th>IP</th><th>状态</th><th>最后在线</th><th>操作</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function auditTableHtml(items){
  if(!items||!items.length) return '<div class="empty">暂无记录</div>';
  const rows = items.map(a=>{
    const dur = a.duration_seconds!=null ? fmtDur(a.duration_seconds) : '';
    return `<tr>
      <td>${esc(new Date(a.started_at).toLocaleString('zh-CN'))}</td>
      <td>${esc(a.operator)}</td>
      <td><span class="pill gray">${esc(actionName(a.action))}</span></td>
      <td>${esc(a.target_hostname||a.target_rustdesk_id||'-')}</td>
      <td>${dur||'-'}</td>
      <td>${esc(resultName(a.result))}</td>
      <td>${esc(a.client_ip||'-')}</td>
      <td>${esc(a.note||'')}</td>
    </tr>`;
  }).join('');
  return `<table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>目标设备</th><th>时长</th><th>结果</th><th>来源IP</th><th>备注</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function actionName(a){ return {connect:'远程协助',login:'登录',change_password:'改密',device_delete:'删除设备',rotate_password:'换密码',update_settings:'改设置'}[a]||a; }
function resultName(r){ return {initiated:'已发起',ended:'已结束',success:'成功',failed:'失败'}[r]||r||'-'; }
function fmtDur(s){ if(s<60)return s+' 秒'; const m=Math.floor(s/60); if(m<60)return m+' 分 '+(s%60)+' 秒'; return Math.floor(m/60)+' 时 '+(m%60)+' 分'; }

function openModal(title, bodyHtml, onOk, okText){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-mask"><div class="modal">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="close-x" onclick="closeModal()">&times;</button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">关闭</button>
      ${onOk?`<button class="btn" id="modalOk">${esc(okText||'确定')}</button>`:''}
    </div></div></div>`;
  if(onOk){ document.getElementById('modalOk').onclick = async ()=>{ const r=await onOk(); if(r!==false) closeModal(); }; }
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function copyText(t){ navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>{}); }

function showApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.add('ready');
  document.getElementById('who').textContent = (state.user.display_name||state.user.username)+'（'+state.user.username+'）';
  App.loadOverview(); App.loadDevices(); App.loadSettings();
}
async function logout(){
  try{ await api('/api/auth/logout',{method:'POST'}); }catch(e){}
  state.token=''; state.user=null; localStorage.removeItem('ml_token');
  document.getElementById('app').classList.remove('ready');
  document.getElementById('login').classList.remove('hidden');
}

const viewTitles = {overview:'概览',devices:'设备台账',audit:'会话审计',settings:'系统设置'};
function route(){
  const v = (location.hash||'#overview').slice(1);
  const view = viewTitles[v]?v:'overview';
  document.querySelectorAll('aside nav a').forEach(a=>a.classList.toggle('active', a.dataset.view===view));
  document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));
  document.getElementById('view-'+view).classList.remove('hidden');
  document.getElementById('pageTitle').textContent = viewTitles[view];
  if(view==='devices') App.loadDevices();
  if(view==='audit') App.loadAudit();
  if(view==='settings') App.loadSettings();
  if(view==='overview') App.loadOverview();
}

document.getElementById('loginForm').addEventListener('submit', App.login);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('devQ').addEventListener('keydown', e=>{ if(e.key==='Enter') App.loadDevices(); });
document.getElementById('auditQ').addEventListener('keydown', e=>{ if(e.key==='Enter') App.loadAudit(); });
document.getElementById('s_audit_retention_days');
window.addEventListener('hashchange', route);
App.boot();
setInterval(()=>{ if(state.token && !document.getElementById('app').classList.contains('hidden')) { const v=(location.hash||'#overview').slice(1); if(v==='overview') App.loadOverview(); if(v==='devices') App.loadDevices(); } }, 30000);
</script>
</body>
</html>
