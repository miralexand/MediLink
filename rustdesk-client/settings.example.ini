; RustDesk 自建服务器 · 客户端预置配置
; 用法：复制本文件为 settings.ini，改成你的实际值（settings.ini 不会被提交）。

; 服务端（hbbs）地址，填 Windows 服务端的内网 IP，例如 10.0.0.10
Server=10.0.0.10
; 中继服务器（hbbr）地址，通常与服务端相同
Relay=10.0.0.10
; 服务端公钥：服务器上 E:\rustdesk\data\id_ed25519.pub 的内容
Key=在这里粘贴服务端公钥
; 无人值守固定密码（可留空；留空则使用随机临时密码）
Password=MediLink@123

; 可选：如果你已经在某台客户端里点过“导出服务器配置”，把那串字符串贴这里，
; 优先级高于上面的 Server/Relay/Key。
ConfigString=
